<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#1f6feb"><title>Gastos de viaje</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f7fb;--card:#fff;--tx:#14213d;--mut:#6b7a90;--ac:#1f6feb;--bd:#dbe3ee;--ok:#1a9d5c;--bad:#d64545;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1623;--card:#172236;--tx:#e8eefb;--mut:#92a1ba;--ac:#4d8dff;--bd:#27364f;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;min-height:100vh}
aside{width:230px;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:width .25s,transform .25s;overflow:hidden;flex-shrink:0;position:sticky;top:0;height:100vh}
aside.min{width:64px}
.logo{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--bd)}
.logo img{width:36px;height:36px;border-radius:10px;object-fit:cover;flex-shrink:0}
.logo b{white-space:nowrap}
aside.min .logo b,aside.min .lbl,aside.min .tot{display:none}
nav{flex:1;padding:8px}
nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--tx);padding:12px;border-radius:10px;font-size:15px;cursor:pointer;text-align:left;white-space:nowrap}
nav button.on{background:var(--ac);color:#fff}
nav button span.i{font-size:20px;width:24px;text-align:center}
.tg{border:0;background:none;color:var(--mut);padding:12px;cursor:pointer;font-size:18px;border-top:1px solid var(--bd)}
main{flex:1;padding:20px;min-width:0;max-width:760px;margin:0 auto}
h1{font-size:22px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
input,select{padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px;width:100%}
.btn{grid-column:1/-1;background:var(--ac);color:#fff;border:0;padding:12px;border-radius:10px;font-size:15px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row small{color:var(--mut);display:block}
.row button{border:0;background:none;color:var(--bad);font-size:18px;cursor:pointer}
.big{font-size:30px;font-weight:700}.bar{height:14px;background:var(--bd);border-radius:8px;overflow:hidden;margin:10px 0}
.bar div{height:100%;background:var(--ok);transition:width .3s}
.ok{color:var(--ok)}.bad{color:var(--bad)}.emp{color:var(--mut);text-align:center;padding:10px}
.mb{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;z-index:20;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:18px}
@media(max-width:700px){aside{position:fixed;z-index:15;transform:translateX(-100%);width:230px!important}aside.open{transform:none}.mb{display:block}main{padding-top:56px}}
.dn{display:flex;flex-direction:column;align-items:center;gap:12px}.dn svg{width:220px;max-width:100%}.lg{width:100%;font-size:14px}.lg div{display:flex;align-items:center;gap:8px;padding:3px 0}.lg i{width:12px;height:12px;border-radius:50%;flex-shrink:0}.lg b{margin-left:auto}</style></head><body>
<button class="mb" onclick="document.querySelector('aside').classList.toggle('open')">☰</button>
<aside id="sb"><div class="logo"><img src="icon-192.png" alt="Logo"><b>Mi viaje</b></div><nav id="nav"></nav>
<button class="tg" onclick="sb.classList.toggle('min')" title="Extender / contraer">⇔</button></aside>
<main id="m"></main>
<script>
const C={
presupuesto:{n:'Presupuesto',i:'💰'},
comida:{n:'Comida',i:'🍽️',f:[['lugar','Lugar','text'],['dia','Día','date'],['precio','Precio (€)','number']]},
transporte:{n:'Transporte',i:'🚗',f:[['modo','Modalidad',['Gasolina','Avión']],['dia','Día','date'],['precio','Precio (€)','number']]},
entradas:{n:'Entradas',i:'🎟️',f:[['sitio','Sitio','text'],['dia','Día','date'],['precio','Precio (€)','number']]},
hoteles:{n:'Hoteles',i:'🏨',f:[['sitio','Sitio','text'],['dia','Día','date'],['precio','Precio (€)','number']]},
extras:{n:'Extras',i:'✨',f:[['tipo','Tipo (escríbelo)','text'],['sitio','Sitio','text'],['precio','Precio (€)','number']]}};
let D={budget:0,items:[]},cur='presupuesto';
try{const s=localStorage.getItem('viaje');if(s)D=JSON.parse(s)}catch(e){}
const save=()=>{try{localStorage.setItem('viaje',JSON.stringify(D))}catch(e){}};
const eur=n=>(+n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'});
const tot=k=>D.items.filter(x=>!k||x.c===k).reduce((a,x)=>a+x.precio,0);
const COL={comida:'#f59e0b',transporte:'#3b82f6',entradas:'#a855f7',hoteles:'#ec4899',extras:'#14b8a6',disp:'#94a3b8'};
function donut(){const b=D.budget,t=tot(),r=b-t,den=Math.max(b,t);
if(!den)return '<div class="emp">Añade gastos o un presupuesto para ver el gráfico</div>';
const parts=Object.keys(C).slice(1).map(k=>[C[k].n,tot(k),COL[k]]);
if(r>0)parts.push(['Disponible',r,COL.disp]);
let acc=0;const arcs=parts.filter(p=>p[1]>0).map(p=>{const pc=p[1]/den*100,a=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${p[2]}" stroke-width="5" stroke-dasharray="${pc} ${100-pc}" stroke-dashoffset="${25-acc}"/>`;acc+=pc;return a}).join('');
const mid=r>=0&&b?['Disponible',eur(r)]:b?['Excedido',eur(-r)]:['Gastado',eur(t)];
return `<div class="dn"><svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--bd)" stroke-width="5"/>${arcs}<text x="21" y="20" text-anchor="middle" font-size="3" style="fill:var(--mut)">${mid[0]}</text><text x="21" y="25" text-anchor="middle" font-size="4" font-weight="700" style="fill:var(--tx)">${mid[1]}</text></svg><div class="lg">${parts.map(p=>`<div><i style="background:${p[2]}"></i>${p[0]}<b>${eur(p[1])} · ${Math.round(p[1]/den*100)}%</b></div>`).join('')}</div></div>`}
function nav(){document.getElementById('nav').innerHTML=Object.keys(C).map(k=>`<button class="${k==cur?'on':''}" onclick="go('${k}')"><span class="i">${C[k].i}</span><span class="lbl">${C[k].n}</span></button>`).join('')}
function go(k){cur=k;sb.classList.remove('open');render()}
function render(){nav();const m=document.getElementById('m');
if(cur=='presupuesto'){const t=tot(),b=D.budget,r=b-t,p=b?Math.min(100,t/b*100):0;
m.innerHTML=`<h1>💰 Presupuesto</h1><div class="card"><label>Presupuesto total (€)<input type="number" min="0" step="any" value="${b||''}" onchange="D.budget=+this.value||0;save();render()"></label>
<div class="bar"><div style="width:${p}%;background:${r<0?'var(--bad)':'var(--ok)'}"></div></div>
<div>Gastado: <b>${eur(t)}</b></div><div class="big ${r<0?'bad':'ok'}">${eur(r)}</div><small>${r<0?'Te has pasado del presupuesto':'Te queda disponible'}</small></div>
<div class="card"><b>Distribución</b>${donut()}</div>
<div class="card"><b>Por apartado</b>${Object.keys(C).slice(1).map(k=>`<div class="row"><span>${C[k].i} ${C[k].n}</span><b>${eur(tot(k))}</b></div>`).join('')}</div>`;return}
const c=C[cur],its=D.items.map((x,i)=>[x,i]).filter(([x])=>x.c==cur);
m.innerHTML=`<h1>${c.i} ${c.n}</h1><div class="card"><form onsubmit="add(event)">${c.f.map(([k,l,t])=>`<label>${l}${Array.isArray(t)?`<select name="${k}">${t.map(o=>`<option>${o}</option>`).join('')}</select>`:`<input name="${k}" type="${t}" required ${t=='number'?'min="0" step="any"':''}>`}</label>`).join('')}<button class="btn">Añadir</button></form></div>
<div class="card"><div class="row"><b>Total ${c.n}</b><b>${eur(tot(cur))}</b></div>${its.length?its.map(([x,i])=>`<div class="row"><div>${c.f.filter(f=>f[0]!='precio').map(f=>x[f[0]]).filter(Boolean).join(' · ')}<small>${eur(x.precio)}</small></div><button onclick="del(${i})">🗑</button></div>`).join(''):'<div class="emp">Aún no hay gastos</div>'}</div>`}
function add(e){e.preventDefault();const o={c:cur};new FormData(e.target).forEach((v,k)=>o[k]=v);o.precio=+o.precio;D.items.push(o);save();render()}
function del(i){D.items.splice(i,1);save();render()}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
